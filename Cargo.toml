[package]
name = "xmip-core-message-binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-message-binary"
description = "Binary shape: bytes that are only bytes, one nameless part and no announced type. A xmip-core-message technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The parent capability's `Shape` (`message::shape`; repository-model.md),
# and the Stream it shapes.
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

[dev-dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints]
workspace = true
